<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyrus Eslahi — Portfolio</title>
    <meta
      name="description"
      content="Portfolio website for Cyrus Eslahi, digital designer and creative developer."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Cyrus Eslahi home">
          <span class="brand-mark"></span>
          <span class="brand-text">CYRUS</span>
        </a>

        <nav class="social-nav" aria-label="Social links">
          <a href="#" aria-label="Dribbble">◌</a>
          <a href="#" aria-label="X">✕</a>
          <a href="#" aria-label="Instagram">◍</a>
          <a href="#" aria-label="Behance">◉</a>
        </nav>

        <div class="top-actions">
          <button class="icon-btn" aria-label="Toggle menu">☰</button>
          <a class="download-btn" href="#">DOWNLOAD CV</a>
        </div>
      </header>

      <main class="hero" aria-label="Hero section">
        <p class="bg-word" aria-hidden="true">DEVELOPER</p>

        <aside class="intro-copy">
          <p>
            HELLO! I'M CYRUS<br />
            A DIGITAL DESIGNER AND<br />
            CREATIVE DEVELOPER FROM<br />
            LONDON
          </p>
        </aside>

        <section class="portrait-wrap" aria-label="Portrait of Cyrus Eslahi">
          <img
            src="https://github.com/user-attachments/assets/f74c94c2-9f13-4257-89a5-a2b70be56f32"
            alt="Cyrus Eslahi"
            loading="eager"
          />
        </section>

        <aside class="stats">
          <div>
            <p class="metric">98<span>%</span></p>
            <p class="caption">Client Satisfaction Rate</p>
          </div>
          <div>
            <p class="metric">35<span>+</span></p>
            <p class="caption">Projects Delivered</p>
          </div>
        </aside>
      </main>
    </div>
  </body>
</html>
